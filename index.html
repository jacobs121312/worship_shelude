  "Яків Савич","Ілля Роман","Катя Деркач","Дарина Савич","Сем Дудка","Ніка Рубіж","Олеся Токарчук","Руслан Баладін",

];
const MONTHS_LONG = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_SHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const MONTHS_NOM = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const DOW_SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

/* ================= helpers ================= */
let idSeed = 0;
function uid(prefix){ idSeed += 1; return prefix+'-'+Date.now().toString(36)+'-'+idSeed+'-'+Math.random().toString(36).slice(2,6); }
function toISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function formatLong(s){ const d=parseISO(s); return d.getDate()+' '+MONTHS_LONG[d.getMonth()]+' '+d.getFullYear(); }
function formatShort(s){ const d=parseISO(s); return { day:d.getDate(), month:MONTHS_SHORT[d.getMonth()], year:d.getFullYear() }; }
function nextSundayAfter(dateObj){ const d=new Date(dateObj.getFullYear(),dateObj.getMonth(),dateObj.getDate()); d.setDate(d.getDate()+(d.getDay()===0?7:7-d.getDay())); return d; }
function todayISO(){ return toISO(new Date()); }
function declineSluzhinnia(n){
  const m10=n%10, m100=n%100;
  if (m10===1 && m100!==11) return 'служіння';
  if ((m10===2||m10===3||m10===4) && !(m100===12||m100===13||m100===14)) return 'служіння';
  return 'служінь';
}

function buildDefaultState(){
  const roles = DEFAULT_ROLE_NAMES.map(name => ({id: uid('role'), name}));
  const services = [];
  let cursor = new Date();
  for (let i=0;i<4;i++){
    cursor = i===0 ? nextSundayAfter(new Date()) : nextSundayAfter(cursor);
    services.push({ id: uid('svc'), date: toISO(cursor), note: '', leaderId: null, positions: roles.map(r => ({id: uid('pos'), roleId: r.id, personId: null})) });
  }
  return { roles, people: [], services, serviceTime: '09:30', teamSeeded: false };
}
function normalizeState(raw){
  if (!raw || !Array.isArray(raw.services) || !Array.isArray(raw.roles)) return buildDefaultState();
  const roleIds = new Set(raw.roles.map(r => r.id));
  const services = raw.services.map(sv => ({
    id: sv.id || uid('svc'), date: sv.date, note: sv.note || '', leaderId: sv.leaderId || null,
    positions: Array.isArray(sv.positions) ? sv.positions.filter(p => roleIds.has(p.roleId)).map(p => ({id: p.id || uid('pos'), roleId: p.roleId, personId: p.personId || null})) : []
  }));
  const people = Array.isArray(raw.people) ? raw.people.map(p => ({id: p.id || uid('person'), name: p.name || '', roles: Array.isArray(p.roles) ? p.roles : [], active: p.active !== false})) : [];
  return { roles: raw.roles, people, services, serviceTime: raw.serviceTime || '09:30', teamSeeded: !!raw.teamSeeded };
}

function buildEventTimes(dateISO, timeStr, durationHours){
  const d = parseISO(dateISO);
  const hm = (timeStr||'09:30').split(':').map(Number);
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hm[0], hm[1], 0, 0);
  const end = new Date(start.getTime());
  end.setHours(end.getHours() + (durationHours||2));
  return { start, end };
}
function fmtUTC(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function calendarLinks(dateISO, timeStr, durationHours, title, description){
  const t = buildEventTimes(dateISO, timeStr, durationHours);
  const google = 'https://calendar.google.com/calendar/render?' + new URLSearchParams({action:'TEMPLATE', text:title, dates: fmtUTC(t.start)+'/'+fmtUTC(t.end), details: description||''}).toString();
  const outlook = 'https://outlook.live.com/calendar/0/deeplink/compose?' + new URLSearchParams({path:'/calendar/action/compose', rru:'addevent', subject:title, startdt:t.start.toISOString(), enddt:t.end.toISOString(), body: description||''}).toString();
  return { google, outlook };
}

function h(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(key => {
    const val = attrs[key];
    if (val === undefined || val === null || val === false) return;
    if (key === 'class') node.className = val;
    else if (key === 'text') node.textContent = val;
    else if (key === 'value') node.value = val;
    else if (key === 'checked') node.checked = !!val;
    else if (key.indexOf('on') === 0 && typeof val === 'function') node.addEventListener(key.slice(2).toLowerCase(), val);
    else node.setAttribute(key, val);
  });
  const kids = children == null ? [] : (Array.isArray(children) ? children : [children]);
  kids.forEach(c => {
    if (c === null || c === undefined || c === false) return;
    node.appendChild((typeof c === 'string' || typeof c === 'number') ? document.createTextNode(String(c)) : c);
  });
  return node;
}

function sortedServices(){ return state.services.slice().sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0)); }
function roleName(id){ const r = state.roles.find(x => x.id===id); return r ? r.name : '(видалена роль)'; }
function computeStats(){
  const today = todayISO();
  return state.people.map(p => {
    let past=0, upcoming=0, lastDate=null; const byRole={}; const upcomingList=[];
    state.services.forEach(sv => {
      sv.positions.forEach(pos => {
        if (pos.personId !== p.id) return;
        if (sv.date < today) past++; else { upcoming++; upcomingList.push({date: sv.date, roleId: pos.roleId}); }
        byRole[pos.roleId] = (byRole[pos.roleId]||0)+1;
        if (!lastDate || sv.date > lastDate) lastDate = sv.date;
      });
    });
    upcomingList.sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
    return Object.assign({}, p, {past, upcoming, total: past+upcoming, byRole, lastDate, upcomingList});
  });
}

/* ================= persistence (Firestore) ================= */
function persist(newState){
  state = newState;
  render();
  setDoc(stateDocRef, { editCode: editCode, payload: newState }).catch(err => {
    console.error('Save failed', err);
    alert('Не вдалося зберегти зміни — код доступу міг застаріти. Спробуйте увійти ще раз.');
    canEdit = false; editCode = '';
    try { localStorage.removeItem('wtp-editcode'); } catch(e){}
    render();
  });
}
function tryUnlock(code){
  return setDoc(stateDocRef, { editCode: code, payload: state }, { merge: true })
    .then(() => {
      editCode = code; canEdit = true;
      try { localStorage.setItem('wtp-editcode', code); } catch(e){}
      render();
      seedTeam();
      return true;
    })
    .catch(() => { alert('Невірний код доступу.'); return false; });
}
function seedTeam(){
  if (state.teamSeeded) return;
  const existing = new Set(state.people.map(p => p.name.trim().toLowerCase()));
  const added = TEAM_SEED.filter(name => !existing.has(name.toLowerCase())).map(name => ({id: uid('person'), name, roles: [], active: true}));
  withState(next => { next.people = state.people.concat(added); next.teamSeeded = true; });
}
function lockAgain(){
  canEdit = false; editCode = '';
  try { localStorage.removeItem('wtp-editcode'); } catch(e){}
  render();
}

onSnapshot(stateDocRef, snap => {
  if (snap.exists()) {
    const data = snap.data();
    if (data && data.payload) state = normalizeState(data.payload);
  }
  const firstLoad = !loaded;
  loaded = true;
  render();
  // Автовхід лише після завантаження даних — інакше tryUnlock перезапише базу порожнім станом
  if (firstLoad && editCode && !canEdit) tryUnlock(editCode);
}, err => {
  console.error('Listen failed', err);
  loaded = true;
  render();
});


/* ================= mutations ================= */
function withState(mut){ const next = Object.assign({}, state); mut(next); persist(next); }
function addService(dateObj){
  const date = toISO(dateObj);
  if (state.services.some(s => s.date===date)) return;
  const sorted = sortedServices();
  const template = sorted.length ? sorted[sorted.length-1].positions : state.roles.map(r => ({roleId: r.id}));
  const positions = template.map(p => ({id: uid('pos'), roleId: p.roleId, personId: null}));
  withState(next => { next.services = state.services.concat([{id: uid('svc'), date, note:'', leaderId: null, positions}]); });
}
function addNextSunday(){
  const sorted = sortedServices();
  const last = sorted.length ? parseISO(sorted[sorted.length-1].date) : new Date();
  addService(nextSundayAfter(last));
}
function removeService(id){ withState(next => { next.services = state.services.filter(s => s.id!==id); }); }
function setNote(id, note){ withState(next => { next.services = state.services.map(s => s.id===id ? Object.assign({},s,{note}) : s); }); }
function setAssignment(serviceId, positionId, personId){
  withState(next => { next.services = state.services.map(sv => sv.id!==serviceId ? sv : Object.assign({}, sv, {positions: sv.positions.map(p => p.id===positionId ? Object.assign({},p,{personId: personId||null}) : p)})); });
}
function addExistingPosition(serviceId, roleId){
  withState(next => { next.services = state.services.map(sv => sv.id!==serviceId ? sv : Object.assign({}, sv, {positions: sv.positions.concat([{id: uid('pos'), roleId, personId:null}])})); });
}
function duplicatePosition(serviceId, positionId){
  withState(next => { next.services = state.services.map(sv => {
    if (sv.id!==serviceId) return sv;
    const idx = sv.positions.findIndex(p => p.id===positionId);
    if (idx===-1) return sv;
    const copy = {id: uid('pos'), roleId: sv.positions[idx].roleId, personId:null};
    const positions = sv.positions.slice(); positions.splice(idx+1,0,copy);
    return Object.assign({}, sv, {positions});
  }); });
}
function addCustomPosition(serviceId, name){
  if (!name || !name.trim()) return;
  const role = {id: uid('role'), name: name.trim()};
  withState(next => {
    next.roles = state.roles.concat([role]);
    next.services = state.services.map(sv => sv.id!==serviceId ? sv : Object.assign({}, sv, {positions: sv.positions.concat([{id: uid('pos'), roleId: role.id, personId:null}])}));
  });
}
function removePositionFromService(serviceId, positionId){
  withState(next => { next.services = state.services.map(sv => sv.id!==serviceId ? sv : Object.assign({}, sv, {positions: sv.positions.filter(p => p.id!==positionId)})); });
}
function setLeader(serviceId, personId){ withState(next => { next.services = state.services.map(sv => sv.id===serviceId ? Object.assign({}, sv, {leaderId: personId || null}) : sv); }); }
function setServiceTime(time){ withState(next => { next.serviceTime = time; }); }
function addPerson(name, roleIds){
  if (!name || !name.trim()) return;
  withState(next => { next.people = state.people.concat([{id: uid('person'), name: name.trim(), roles: roleIds.slice(), active:true}]); });
}
function removePerson(id){
  withState(next => {
    next.people = state.people.filter(p => p.id!==id);
    next.services = state.services.map(sv => Object.assign({}, sv, {leaderId: sv.leaderId===id ? null : sv.leaderId, positions: sv.positions.map(p => p.personId===id ? Object.assign({},p,{personId:null}) : p)}));
  });
}
function togglePersonRole(personId, roleId){
  withState(next => { next.people = state.people.map(p => { if (p.id!==personId) return p; const has = p.roles.includes(roleId); return Object.assign({}, p, {roles: has ? p.roles.filter(r=>r!==roleId) : p.roles.concat([roleId])}); }); });
}
function renamePerson(personId, name){ if (!name || !name.trim()) return; withState(next => { next.people = state.people.map(p => p.id===personId ? Object.assign({},p,{name: name.trim()}) : p); }); }
function togglePersonActive(personId){ withState(next => { next.people = state.people.map(p => p.id===personId ? Object.assign({},p,{active:!p.active}) : p); }); }
function addCatalogRole(name){ if (!name || !name.trim()) return; withState(next => { next.roles = state.roles.concat([{id: uid('role'), name: name.trim()}]); }); }
function renameRole(roleId, name){ withState(next => { next.roles = state.roles.map(r => r.id===roleId ? Object.assign({},r,{name}) : r); }); }
function removeRoleEverywhere(roleId){
  withState(next => {
    next.roles = state.roles.filter(r => r.id!==roleId);
    next.people = state.people.map(p => Object.assign({}, p, {roles: p.roles.filter(r=>r!==roleId)}));
    next.services = state.services.map(sv => Object.assign({}, sv, {positions: sv.positions.filter(p=>p.roleId!==roleId)}));
  });
}

  root.appendChild(canEdit ? renderAdmin() : renderPublicView());
}

function renderScheduleTab(){
  const section = h('section', {});
  let customDateVal = '';
  const dateInput = h('input', {type:'date', class:'wtp-input'});
  dateInput.addEventListener('input', e => customDateVal = e.target.value);
  section.appendChild(h('div', {class:'wtp-toolbar'}, [
    h('button', {class:'wtp-btn wtp-btn-primary', onclick:()=>addNextSunday(), text:'+ Додати наступну неділю'}),
    h('div', {class:'wtp-inline-add'}, [ dateInput, h('button', {class:'wtp-btn', onclick:()=>{ if (customDateVal) addService(parseISO(customDateVal)); }, text:'Додати дату'}) ]),
    h('div', {class:'wtp-inline-add'}, [ h('label',{class:'wtp-hint', text:'Час початку:'}), h('input', {type:'time', class:'wtp-input', value: state.serviceTime, onchange:e=>setServiceTime(e.target.value)}) ])
  ]));

  if (state.people.length===0) section.appendChild(h('p', {class:'wtp-hint', text:'Спочатку додайте учасників команди на вкладці «Команда» — тоді зʼявляться варіанти для призначення.'}));

  const services = sortedServices();
  if (services.length===0){ section.appendChild(h('p', {class:'wtp-hint', text:'Ще немає жодної запланованої неділі. Додайте першу вище.'})); return section; }

  const list = h('div', {class:'wtp-service-list'});
  const today = todayISO();
  services.forEach(sv => {
    const d = formatShort(sv.date);
    const isPast = sv.date < today;
    const counts = {};
    sv.positions.forEach(p => { if (p.personId) counts[p.personId] = (counts[p.personId]||0)+1; });

    const noteInput = h('input', {class:'wtp-note-input', placeholder:"нотатка про цю неділю (необов'язково)", value: sv.note});
    noteInput.addEventListener('blur', e => { if (e.target.value !== sv.note) setNote(sv.id, e.target.value); });

    const card = h('div', {class:'wtp-card'+(isPast?' past':'')}, [
      h('div', {class:'wtp-card-head'}, [
        h('div', {class:'wtp-date-badge'}, [ h('span',{class:'wtp-date-dow', text:'НД'}), h('span',{class:'wtp-date-day', text:String(d.day)}) ]),
        h('div', {class:'wtp-card-head-text'}, [ h('div', {class:'wtp-date-full', text: formatLong(sv.date)}), noteInput, renderLeaderPick(sv) ]),
        h('button', {class:'wtp-icon-btn', title:'Видалити цю неділю', onclick:()=>removeService(sv.id), text:'×'})
      ])
    ]);

    const posList = h('div', {class:'wtp-position-list'});
    if (sv.positions.length===0) posList.appendChild(h('p', {class:'wtp-hint', style:'margin:.5rem 0'}, 'Немає жодної позиції — додайте нижче.'));
    sv.positions.forEach(pos => {
      const assigned = pos.personId || '';
      const isConflict = !!(assigned && counts[assigned] > 1);
      const eligible = state.people.filter(p => p.roles.includes(pos.roleId) && (p.active || p.id===assigned));
      const others = state.people.filter(p => !p.roles.includes(pos.roleId) && (p.active || p.id===assigned));

      const select = h('select', {class:'wtp-select'});
      select.appendChild(h('option', {value:''}, '— вільно —'));
      eligible.forEach(p => select.appendChild(h('option', {value:p.id}, p.name + (!p.active ? ' (неактивний)' : ''))));
      if (others.length>0){ const grp=document.createElement('optgroup'); grp.label='інші учасники'; others.forEach(p=>grp.appendChild(h('option',{value:p.id},p.name))); select.appendChild(grp); }
      select.value = assigned;
      select.addEventListener('change', e => setAssignment(sv.id, pos.id, e.target.value));

      const row = h('div', {class:'wtp-position-row'+(isConflict?' conflict':'')}, [ h('span', {class:'wtp-position-name', text: roleName(pos.roleId)}), select ]);
      if (assigned){
        const isLead = sv.leaderId===assigned;
        row.appendChild(h('button', {class:'wtp-leader-btn'+(isLead?' on':''), title: isLead ? 'Зняти статус «відповідальний»' : 'Призначити відповідальним за цю неділю', onclick:()=>setLeader(sv.id, isLead ? null : assigned), text: isLead ? '★' : '☆'}));
      }
      if (isConflict) row.appendChild(h('span', {class:'wtp-conflict-note', text:'також грає цього дня'}));
      if (assigned){
        const person = state.people.find(p => p.id===assigned);
        if (person){
          const links = calendarLinks(sv.date, state.serviceTime, 2, 'Прославлення: '+roleName(pos.roleId), person.name+' — '+roleName(pos.roleId));
          row.appendChild(h('span', {class:'wtp-cal-links'}, [
            h('a', {href:links.google, target:'_blank', rel:'noopener', class:'wtp-cal-link', text:'Google'}),
            h('a', {href:links.outlook, target:'_blank', rel:'noopener', class:'wtp-cal-link', text:'Outlook'})
          ]));
        }
      }
      row.appendChild(h('button', {class:'wtp-dup-btn', title:'Продублювати цю позицію ще раз на цю неділю', onclick:()=>duplicatePosition(sv.id, pos.id), text:'Дублювати'}));
      row.appendChild(h('button', {class:'wtp-icon-btn', title:'Прибрати цю позицію на цю неділю', onclick:()=>removePositionFromService(sv.id, pos.id), text:'×'}));
      posList.appendChild(row);
    });
    card.appendChild(posList);

    const addWrap = h('div', {class:'wtp-add-position'});
    if (state.roles.length>0){
      const addSelect = h('select', {class:'wtp-select wtp-select-add'});
      addSelect.appendChild(h('option', {value:''}, '+ додати роль (можна ще раз ту саму)…'));
      state.roles.forEach(r => addSelect.appendChild(h('option', {value:r.id}, r.name)));
      addSelect.addEventListener('change', e => { if (e.target.value) addExistingPosition(sv.id, e.target.value); });
      addWrap.appendChild(addSelect);
    }
    let customPosVal = '';
    const customPosInput = h('input', {class:'wtp-input', placeholder:'або нова позиція для цієї неділі'});
    customPosInput.addEventListener('input', e => customPosVal = e.target.value);
    customPosInput.addEventListener('keydown', e => { if (e.key==='Enter' && customPosVal.trim()){ addCustomPosition(sv.id, customPosVal); customPosVal=''; } });
    addWrap.appendChild(customPosInput);
    addWrap.appendChild(h('button', {class:'wtp-btn', onclick:()=>{ if (customPosVal.trim()){ addCustomPosition(sv.id, customPosVal); customPosVal=''; } }, text:'Додати'}));
    card.appendChild(addWrap);
    list.appendChild(card);
  });
  section.appendChild(list);
  return section;
}

function renderLeaderPick(sv){
  const inTeam = [];
  sv.positions.forEach(pos => { if (pos.personId && !inTeam.includes(pos.personId)) inTeam.push(pos.personId); });
  const select = h('select', {class:'wtp-select'});
  select.appendChild(h('option', {value:''}, '— не призначено —'));
  inTeam.forEach(id => { const p = state.people.find(x => x.id===id); if (p) select.appendChild(h('option', {value:id}, p.name)); });
  if (sv.leaderId && !inTeam.includes(sv.leaderId)){
    const p = state.people.find(x => x.id===sv.leaderId);
    if (p) select.appendChild(h('option', {value:p.id}, p.name+' (не в складі)'));
  }
  select.value = sv.leaderId || '';
  select.addEventListener('change', e => setLeader(sv.id, e.target.value));
  return h('div', {class:'wtp-leader-pick'}, [ h('label', {text:'★ Відповідальний:'}), select ]);
}

function renderTeamTab(){
  const section = h('section', {class:'wtp-two-col'});
  const left = h('div', {});
  left.appendChild(h('h2', {class:'wtp-h2', text:'Учасники'}));

  let newName = ''; let newRoleIds = [];
  const nameInput = h('input', {class:'wtp-input', placeholder:"Імʼя учасника"});
  nameInput.addEventListener('input', e => newName = e.target.value);
  function submitPerson(){ addPerson(newName, newRoleIds); newName=''; newRoleIds=[]; }
  nameInput.addEventListener('keydown', e => { if (e.key==='Enter') submitPerson(); });
  const chipRow = h('div', {class:'wtp-chip-row'});
  state.roles.forEach(r => {
    const chip = h('button', {type:'button', class:'wtp-chip', text:r.name});
    chip.addEventListener('click', () => { const idx=newRoleIds.indexOf(r.id); if (idx===-1){newRoleIds.push(r.id); chip.classList.add('on');} else {newRoleIds.splice(idx,1); chip.classList.remove('on');} });
    chipRow.appendChild(chip);
  });
  left.appendChild(h('div', {class:'wtp-add-person'}, [ nameInput, chipRow, h('button', {class:'wtp-btn wtp-btn-primary', onclick:()=>submitPerson(), text:'Додати учасника'}) ]));

  if (state.people.length===0){
    left.appendChild(h('p', {class:'wtp-hint', text:'Команда поки порожня. Додайте першого учасника вище.'}));
  } else {
    const ul = h('ul', {class:'wtp-person-list'});
    state.people.forEach(p => {
      const prow = h('div', {class:'wtp-chip-row'});
      state.roles.forEach(r => prow.appendChild(h('button', {type:'button', class:'wtp-chip wtp-chip-sm'+(p.roles.includes(r.id)?' on':''), text:r.name, onclick:()=>togglePersonRole(p.id, r.id)})));
      const nameField = h('input', {class:'wtp-person-name-input', value:p.name, title:'Натисніть, щоб змінити імʼя', 'aria-label':'Імʼя учасника'});
      nameField.addEventListener('blur', e => { const v = e.target.value.trim(); if (!v) e.target.value = p.name; else if (v !== p.name) renamePerson(p.id, v); });
      nameField.addEventListener('keydown', e => { if (e.key==='Enter') e.target.blur(); });
      const cb = h('input', {type:'checkbox'}); cb.checked = p.active; cb.addEventListener('change', ()=>togglePersonActive(p.id));
      const toggleLabel = h('label', {class:'wtp-toggle-label'}, [cb, document.createTextNode('активний(-а)')]);
      ul.appendChild(h('li', {class:'wtp-person-row'+(p.active?'':' inactive')}, [
        h('div', {class:'wtp-person-main'}, [ nameField, prow ]),
        h('div', {class:'wtp-person-actions'}, [ toggleLabel, h('button', {class:'wtp-icon-btn', title:'Видалити учасника', onclick:()=>removePerson(p.id), text:'×'}) ])
      ]));
    });
    left.appendChild(ul);
  }
  section.appendChild(left);

  const right = h('div', {});
  right.appendChild(h('h2', {class:'wtp-h2', text:'Каталог ролей / інструментів'}));
  right.appendChild(h('p', {class:'wtp-hint', style:'margin-bottom:.75rem'}, 'Це загальний перелік — з нього ви обираєте позиції для кожної конкретної неділі на вкладці «Розклад».'));
  let newRoleName = '';
  const roleNameInput = h('input', {class:'wtp-input', placeholder:'Назва ролі, напр. Перкусія'});
  roleNameInput.addEventListener('input', e => newRoleName = e.target.value);
  function submitRole(){ addCatalogRole(newRoleName); newRoleName=''; }
  roleNameInput.addEventListener('keydown', e => { if (e.key==='Enter') submitRole(); });
  right.appendChild(h('div', {class:'wtp-add-role'}, [ roleNameInput, h('button', {class:'wtp-btn', onclick:()=>submitRole(), text:'Додати роль'}) ]));
  const rl = h('ul', {class:'wtp-role-list'});
  state.roles.forEach(r => {
    const nameField = h('input', {class:'wtp-role-name-input', value:r.name});
    nameField.addEventListener('blur', e => { if (e.target.value !== r.name) renameRole(r.id, e.target.value); });
    rl.appendChild(h('li', {class:'wtp-role-row'}, [ nameField, h('button', {class:'wtp-icon-btn', title:'Видалити роль всюди', onclick:()=>removeRoleEverywhere(r.id), text:'×'}) ]));
  });
  right.appendChild(rl);
  section.appendChild(right);
  return section;
}

function renderLoadTab(){
  const section = h('section', {});
  section.appendChild(h('div', {class:'wtp-toolbar'}, [
    h('button', {class:'wtp-btn'+(loadSortKey==='total'?' wtp-btn-active':''), onclick:()=>{loadSortKey='total'; render();}, text:'За навантаженням'}),
    h('button', {class:'wtp-btn'+(loadSortKey==='name'?' wtp-btn-active':''), onclick:()=>{loadSortKey='name'; render();}, text:'За іменем'})
  ]));
  const stats = computeStats();
  const sorted = stats.slice();
  if (loadSortKey==='total') sorted.sort((a,b)=>b.total-a.total); else sorted.sort((a,b)=>a.name.localeCompare(b.name,'uk'));
  if (sorted.length===0){ section.appendChild(h('p', {class:'wtp-hint', text:'Додайте учасників команди, щоб побачити статистику навантаженості.'})); return section; }
  const maxTotal = Math.max(1, ...sorted.map(s=>s.total));
  const today = todayISO();
  const list = h('div', {class:'wtp-load-list'});
  sorted.forEach(p => {
    const daysAgo = p.lastDate ? Math.round((parseISO(today)-parseISO(p.lastDate))/86400000) : null;
    const row = h('div', {class:'wtp-load-row'+(p.active?'':' inactive')}, [
      h('div', {class:'wtp-load-top'}, [ h('span',{class:'wtp-person-name', text:p.name}), h('span',{class:'wtp-load-count', text:p.total+' '+declineSluzhinnia(p.total)}) ]),
      h('div', {class:'wtp-bar-track'}, [ h('div', {class:'wtp-bar-fill', style:'width:'+((p.total/maxTotal)*100)+'%'}) ]),
      h('div', {class:'wtp-load-meta'}, [
        h('span', {text:'відіграно: '+p.past}), h('span', {text:'заплановано: '+p.upcoming}),
        h('span', {text:'востаннє: '+(p.lastDate ? (formatLong(p.lastDate)+' ('+(daysAgo===0?'сьогодні':daysAgo+' дн. тому')+')') : 'ще не грав(-ла)')})
      ])
    ]);
    if (Object.keys(p.byRole).length>0){
      const chipRow = h('div', {class:'wtp-chip-row'});
      Object.keys(p.byRole).forEach(roleId => chipRow.appendChild(h('span', {class:'wtp-chip wtp-chip-sm wtp-chip-static', text: roleName(roleId)+': '+p.byRole[roleId]})));
      row.appendChild(chipRow);
    }
    if (p.upcomingList.length>0){
      const details = document.createElement('details'); details.className='wtp-upcoming-details';
      const summary = document.createElement('summary'); summary.textContent = 'Показати заплановані дати ('+p.upcomingList.length+')';
      details.appendChild(summary);
      const ulU = h('ul', {class:'wtp-upcoming-list'});
      p.upcomingList.forEach(item => {
        const links = calendarLinks(item.date, state.serviceTime, 2, 'Прославлення: '+roleName(item.roleId), p.name+' — '+roleName(item.roleId));
        ulU.appendChild(h('li', {class:'wtp-upcoming-item'}, [
          h('span', {text: formatLong(item.date)+' — '+roleName(item.roleId)}),
          h('span', {class:'wtp-cal-links'}, [ h('a',{href:links.google,target:'_blank',rel:'noopener',class:'wtp-cal-link',text:'Google'}), h('a',{href:links.outlook,target:'_blank',rel:'noopener',class:'wtp-cal-link',text:'Outlook'}) ])
        ]));
      });
      details.appendChild(ulU);
      row.appendChild(details);
    }
    list.appendChild(row);
  });
  section.appendChild(list);
  return section;
}

function renderPublicView(){
  const page = h('div', {class:'wtp-page'});
  page.appendChild(h('header', {class:'wtp-header'}, [ h('div', {}, [ h('h1', {text:'Графік служінь'}), h('p', {class:'wtp-subtitle', text:'Перегляньте свою чергу на прославлення'}) ]) ]));
  page.appendChild(h('p', {class:'wtp-hint', text:'Цей перегляд лише для читання — змінювати розклад може адміністратор команди.'}));

  const activePeople = state.people.filter(p=>p.active);
  const select = h('select', {class:'wtp-select wtp-my-select'});
  select.appendChild(h('option', {value:''}, "Оберіть своє імʼя…"));
  activePeople.forEach(p => select.appendChild(h('option', {value:p.id}, p.name)));
  select.value = myPersonId;
  select.addEventListener('change', e => { myPersonId = e.target.value; try{localStorage.setItem('wtp-my-id', myPersonId);}catch(err){} render(); });
  page.appendChild(h('div', {class:'wtp-my-select-wrap'}, [ h('label',{class:'wtp-hint', text:'Я:'}), select ]));

  if (!myPersonId){ page.appendChild(h('p', {class:'wtp-hint', text:'Оберіть себе зі списку вище, щоб побачити свій розклад.'})); appendFooter(page); return page; }
  const person = state.people.find(p=>p.id===myPersonId);
  if (!person){ page.appendChild(h('p', {class:'wtp-hint', text:'Учасника не знайдено — можливо, адміністратор оновив список.'})); appendFooter(page); return page; }

  const myStats = computeStats().find(s=>s.id===myPersonId);
  page.appendChild(h('div', {class:'wtp-quickstats wtp-public-stats'}, [
    h('div', {class:'wtp-quickstat'}, [ h('span',{class:'wtp-qs-num', text:String(myStats?myStats.upcoming:0)}), h('span',{class:'wtp-qs-label', text:'заплановано'}) ]),
    h('div', {class:'wtp-quickstat'}, [ h('span',{class:'wtp-qs-num', text:String(myStats?myStats.past:0)}), h('span',{class:'wtp-qs-label', text:'відіграно'}) ])
  ]));

  const today = todayISO();
  const nextMine = sortedServices().find(sv => sv.date >= today && sv.positions.some(pos => pos.personId===myPersonId));
  if (nextMine){
    const nextRoles = nextMine.positions.filter(pos => pos.personId===myPersonId).map(pos => roleName(pos.roleId)).join(', ') + (nextMine.leaderId===myPersonId ? ' · ★ відповідальний' : '');
    page.appendChild(h('div', {class:'wtp-next-up'}, [
      h('span', {class:'wtp-hint', text:'Наступне служіння:'}),
      h('button', {class:'wtp-cal-link', style:'border:none;cursor:pointer;font-size:.8rem;', onclick:()=>{ const d=parseISO(nextMine.date); calMonth={y:d.getFullYear(), m:d.getMonth()}; openServiceId=nextMine.id; render(); }, text: formatLong(nextMine.date)+' — '+nextRoles})
    ]));
  } else {
    page.appendChild(h('p', {class:'wtp-hint', style:'margin:0 0 1rem', text:'Найближчим часом ви не заплановані на служіння.'}));
  }

  page.appendChild(renderMyCalendar(person));
  const modal = renderServiceModal(person);
  if (modal) page.appendChild(modal);
  appendFooter(page);
  return page;
}

function renderMyCalendar(person){
  const wrap = h('div', {class:'wtp-cal'});
  const svcByDate = {};
  state.services.forEach(sv => { svcByDate[sv.date] = sv; });
  function shift(delta){
    let m = calMonth.m + delta, y = calMonth.y;
    if (m < 0){ m = 11; y--; } else if (m > 11){ m = 0; y++; }
    calMonth = {y, m}; render();
  }
  const now = new Date();
  wrap.appendChild(h('div', {class:'wtp-cal-head'}, [
    h('h2', {class:'wtp-cal-title', text: MONTHS_NOM[calMonth.m]+' '+calMonth.y}),
    h('div', {class:'wtp-cal-nav'}, [
      h('button', {class:'wtp-cal-arrow', title:'Попередній місяць', onclick:()=>shift(-1), text:'‹'}),
      h('button', {class:'wtp-btn wtp-cal-today-btn', onclick:()=>{ calMonth={y:now.getFullYear(), m:now.getMonth()}; render(); }, text:'Сьогодні'}),
      h('button', {class:'wtp-cal-arrow', title:'Наступний місяць', onclick:()=>shift(1), text:'›'})
    ])
  ]));

  const dowRow = h('div', {class:'wtp-cal-dow-row'});
  DOW_SHORT.forEach((d, i) => dowRow.appendChild(h('div', {class:'wtp-cal-dow'+(i>=5?' weekend':''), text:d})));
  wrap.appendChild(dowRow);

  const grid = h('div', {class:'wtp-cal-grid'});
  const first = new Date(calMonth.y, calMonth.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
  const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;
  const today = todayISO();
  for (let i = 0; i < totalCells; i++){
    const date = new Date(calMonth.y, calMonth.m, 1 - offset + i);
    const iso = toISO(date);
    const sv = svcByDate[iso];
    const mine = sv ? sv.positions.filter(pos => pos.personId===person.id) : [];
    let cls = 'wtp-cal-cell';
    if (date.getMonth() !== calMonth.m) cls += ' out';
    if (iso === today) cls += ' today';
    if (iso < today) cls += ' past';
    if (sv) cls += ' has-svc';
    if (mine.length || (sv && sv.leaderId===person.id)) cls += ' mine';
    const label = sv ? formatLong(iso)+': '+(mine.length ? mine.map(pos => roleName(pos.roleId)).join(', ') : 'служіння без вас') + (sv.leaderId===person.id ? ', ви відповідальний' : '') : null;
    const cell = h(sv ? 'button' : 'div', {class: cls, type: sv ? 'button' : null, 'aria-label': label}, [ h('span', {class:'wtp-cal-num', text:String(date.getDate())}) ]);
    if (sv){
      if (sv.leaderId===person.id) cell.appendChild(h('span', {class:'wtp-cal-event lead', text:'★ Відповідальний'}));
      if (mine.length) mine.forEach(pos => cell.appendChild(h('span', {class:'wtp-cal-event', title: roleName(pos.roleId), text: roleName(pos.roleId)})));
      else cell.appendChild(h('span', {class:'wtp-cal-event other', text:'Служіння'}));
      cell.addEventListener('click', () => { openServiceId = sv.id; render(); });
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  wrap.appendChild(h('div', {class:'wtp-cal-legend'}, [
    h('span', {}, [ h('i', {class:'wtp-cal-swatch'}), 'ви служите' ]),
    h('span', {}, [ h('i', {class:'wtp-cal-swatch other'}), 'служіння без вас' ]),
    h('span', {text:'Натисніть на день, щоб побачити весь склад'})
  ]));
  return wrap;
}

function renderServiceModal(person){
  if (!openServiceId) return null;
  const sv = state.services.find(s => s.id===openServiceId);
  if (!sv){ openServiceId = null; return null; }
  const close = () => { openServiceId = null; render(); };
  const d = parseISO(sv.date);
  const headText = h('div', {class:'wtp-card-head-text'}, [
    h('div', {class:'wtp-date-full', text: formatLong(sv.date)}),
    h('div', {class:'wtp-modal-meta', text:'Початок о '+state.serviceTime})
  ]);
  if (sv.note) headText.appendChild(h('div', {class:'wtp-public-note', text: sv.note}));
  const modal = h('div', {class:'wtp-modal', role:'dialog', 'aria-modal':'true'}, [
    h('div', {class:'wtp-card-head'}, [
      h('div', {class:'wtp-date-badge'}, [ h('span',{class:'wtp-date-dow', text: DOW_SHORT[(d.getDay()+6)%7].toUpperCase()}), h('span',{class:'wtp-date-day', text:String(d.getDate())}) ]),
      headText,
      h('button', {class:'wtp-icon-btn', title:'Закрити', onclick: close, text:'×'})
    ])
  ]);
  const leader = sv.leaderId ? state.people.find(x => x.id===sv.leaderId) : null;
  if (leader) modal.appendChild(h('div', {class:'wtp-modal-leader'}, [ h('span', {text:'★ Відповідальний:'}), h('b', {text: leader.name + (leader.id===person.id ? ' (ви)' : '')}) ]));
  const list = h('div', {});
  if (sv.positions.length===0) list.appendChild(h('p', {class:'wtp-hint', text:'Склад на цей день ще не сформовано.'}));
  sv.positions.forEach(pos => {
    const p = pos.personId ? state.people.find(x => x.id===pos.personId) : null;
    const isMe = pos.personId===person.id;
    list.appendChild(h('div', {class:'wtp-team-row'+(isMe?' me':'')}, [
      h('span', {class:'wtp-team-role', text: roleName(pos.roleId)}),
      h('span', {class:'wtp-team-name'+(p?'':' free')}, [ p && p.id===sv.leaderId ? h('span', {class:'wtp-leader-badge', style:'margin-right:.4rem', text:'★'}) : null, p ? (p.name + (isMe ? ' (ви)' : '')) : 'вільно' ])
    ]));
  });
  modal.appendChild(list);

  const mine = sv.positions.filter(pos => pos.personId===person.id);
  if (mine.length && sv.date >= todayISO()){
    const linksWrap = h('div', {class:'wtp-modal-links'});
    mine.forEach(pos => {
      const links = calendarLinks(sv.date, state.serviceTime, 2, 'Прославлення: '+roleName(pos.roleId), person.name+' — '+roleName(pos.roleId));
      linksWrap.appendChild(h('span', {class:'wtp-cal-links'}, [
        h('a',{href:links.google,target:'_blank',rel:'noopener',class:'wtp-cal-link',text:'+ Google Calendar'}),
        h('a',{href:links.outlook,target:'_blank',rel:'noopener',class:'wtp-cal-link',text:'+ Outlook'})
      ]));
    });
    modal.appendChild(linksWrap);
  }
  return h('div', {class:'wtp-modal-backdrop', onclick: e => { if (e.target===e.currentTarget) close(); }}, [modal]);
}

function appendFooter(page){
  page.appendChild(h('div', {class:'wtp-footer'}, [
    h('button', {class:'wtp-link-btn', onclick: () => { const code = prompt('Введіть код доступу адміністратора:'); if (code) tryUnlock(code); }, text:'Я адміністратор →'})
  ]));
}

render();
</script>
